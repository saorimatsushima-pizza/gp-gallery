<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="description" content="架空データだけで動く、Pizzapatch-inのクラシック展示デモ。">
  <title>Pizzapatch-in | Classic Gallery Demo</title>

  <link rel="canonical" href="https://saorimatsushima-pizza.github.io/gp-gallery/gallery/">
  <meta name="theme-color" content="#ff6b35">
  <link rel="icon" href="./assets/icon-32.png" sizes="32x32" type="image/png">
  <link rel="icon" href="./assets/icon-192.png" sizes="192x192" type="image/png">
  <link rel="apple-touch-icon" href="./assets/icon-180.png">

  <meta property="og:type" content="website">
  <meta property="og:locale" content="ja_JP">
  <meta property="og:site_name" content="Chaos Gallery">
  <meta property="og:title" content="Pizzapatch-in | Classic Gallery Demo">
  <meta property="og:description" content="架空データだけで動く、Pizzapatch-inのクラシック展示デモ。">
  <meta property="og:url" content="https://saorimatsushima-pizza.github.io/gp-gallery/gallery/">
  <meta property="og:image" content="https://saorimatsushima-pizza.github.io/gp-gallery/gallery/assets/ogp.jpg">
  <meta property="og:image:width" content="1120">
  <meta property="og:image:height" content="600">
  <meta property="og:image:alt" content="Pizzapatch-in — イベントのチェックインを、ちょっと楽しく。">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="stylesheet" href="./styles.css?v=classic-c">
</head>
<body>
  <nav class="nav" aria-label="メインナビゲーション">
    <a class="nav-logo" href="#top" aria-label="Pizzapatch-in トップへ">🍕 Pizzapatch<span>-in</span></a>
    <div class="nav-actions">
      <span class="demo-pill">Gallery Demo</span>
      <button class="nav-tab active" id="start-button" type="button">🎟️ チェックイン</button>
    </div>
  </nav>

  <main id="top">
    <section class="checkin-hero" aria-labelledby="hero-title">
      <p class="event-badge">🍕 Monthly Event</p>
      <h1 id="hero-title">Pizza<span>patch-in</span> <span class="icon-combo" aria-label="指パッチンでピザが現れるアニメーション"><span class="icon-heart" aria-hidden="true">🫰</span><span class="icon-sparkle" aria-hidden="true">✨</span><span class="icon-pizza" aria-hidden="true">🍕</span></span></h1>
      <p>みんなで食べてつながろう！</p>
      <div class="month-label">📅 Gallery Day</div>
    </section>

    <section class="checkin-body" id="checkin" aria-labelledby="panel-title">
      <div class="progress step-indicator" aria-hidden="true">
        <span class="step-dot active"></span><span class="step-dot"></span><span class="step-dot"></span>
      </div>
      <div class="panel-heading">
        <div>
          <p class="step-label" id="step-label">STEP 1 / 3</p>
          <h2 id="panel-title">🏢 どのチームですか？</h2>
        </div>
        <button class="text-button hidden" id="back-button" type="button">← もどる</button>
      </div>
      <p class="sr-only" id="step-status" role="status"></p>
      <noscript>
        <p class="empty-state">このデモはJavaScriptで動作します。ブラウザのJavaScriptを有効にしてから再読み込みしてください。</p>
      </noscript>
      <div id="step-content"></div>
      <p class="privacy-note">🔒 すべて架空のデータです。通信・保存は行いません。</p>
    </section>
  </main>

  <div class="success-overlay" id="success-overlay" role="dialog" aria-modal="true" aria-labelledby="success-title" hidden>
    <div class="confetti" id="confetti" aria-hidden="true"></div>
    <div class="success-card">
      <div class="success-pizza" aria-hidden="true">🍕</div>
      <p class="eyebrow">CHECK-IN COMPLETE</p>
      <h2 id="success-title">チェックイン完了！</h2>
      <p class="welcome">ようこそ、<span id="success-name"></span></p>
      <p><span id="success-team"></span> で参加します。</p>
      <button class="primary-button" id="reset-button" type="button">もう一度ためす</button>
    </div>
  </div>

  <script src="./app.js?v=classic-c"></script>
</body>
</html>
